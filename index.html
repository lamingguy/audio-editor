<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AudioEdit">
<meta name="theme-color" content="#0f0e0d">
<title>AudioEdit</title>
<style>
:root {
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;
  --radius-xl:1rem;--radius-full:9999px;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
  --font-body:Inter,-apple-system,sans-serif;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
}
[data-theme="dark"] {
  --bg:#0f0e0d;--surface:#141312;--surface-2:#1a1917;
  --surface-off:#201f1d;--surface-dyn:#2a2926;
  --border:#383735;--text:#e8e6e3;--text-muted:#8a8884;--text-faint:#555350;
  --primary:#4f98a3;--primary-hover:#227f8b;
  --primary-glow:rgba(79,152,163,0.15);
  --selection:rgba(79,152,163,0.35);
  --success:#6daa45;--error:#d163a7;
  --shadow-md:0 4px 16px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg:#f7f6f2;--surface:#f9f8f5;--surface-2:#fbfbf9;
  --surface-off:#f3f0ec;--surface-dyn:#e6e4df;
  --border:#d4d1ca;--text:#28251d;--text-muted:#7a7974;--text-faint:#bab9b4;
  --primary:#01696f;--primary-hover:#0c4e54;
  --primary-glow:rgba(1,105,111,0.1);
  --selection:rgba(1,105,111,0.25);
  --success:#437a22;--error:#a12c7b;
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-sm);
  color:var(--text);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input{font:inherit}
#app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:var(--space-3) var(--space-4);
  padding-top:calc(var(--space-3) + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
.topbar-logo{display:flex;align-items:center;gap:var(--space-2);
  font-weight:700;font-size:var(--text-base);letter-spacing:-.02em}
.topbar-logo svg{color:var(--primary)}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-md);
  display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.icon-btn:active{background:var(--surface-off);color:var(--text)}

/* Main scroll */
.main{flex:1;overflow-y:auto;overflow-x:hidden}
.main::-webkit-scrollbar{display:none}

/* Upload */
.upload-zone{margin:var(--space-4);border:2px dashed var(--border);
  border-radius:var(--radius-xl);padding:var(--space-8) var(--space-4);
  text-align:center;cursor:pointer;background:var(--surface);
  transition:border-color var(--transition),background var(--transition)}
.upload-zone.drag-over,.upload-zone:active{border-color:var(--primary);background:var(--primary-glow)}
.upload-icon{color:var(--primary);margin:0 auto var(--space-3)}
.upload-title{font-size:var(--text-base);font-weight:600;margin-bottom:var(--space-1)}
.upload-sub{font-size:var(--text-xs);color:var(--text-muted)}
.upload-formats{font-size:var(--text-xs);color:var(--text-faint);margin-top:var(--space-2)}

/* File info */
.file-info{display:none;margin:var(--space-4) var(--space-4) 0;
  background:var(--surface);border-radius:var(--radius-xl);
  border:1px solid var(--border);padding:var(--space-4)}
.file-info.visible{display:block}
.file-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.file-icon{width:40px;height:40px;border-radius:var(--radius-lg);
  background:var(--primary-glow);display:flex;align-items:center;
  justify-content:center;color:var(--primary);flex-shrink:0}
.file-name{font-weight:600;font-size:var(--text-sm);word-break:break-all}
.file-meta{font-size:var(--text-xs);color:var(--text-muted);margin-top:2px}
.btn-remove{margin-left:auto;width:32px;height:32px;border-radius:var(--radius-full);
  display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex-shrink:0}
.btn-remove:active{background:var(--surface-off);color:var(--error)}

/* Player */
.player-section{margin:var(--space-3) var(--space-4) 0;
  background:var(--surface-off);border-radius:var(--radius-lg);padding:var(--space-4);
  display:none}
.player-section.visible{display:block}

/* Seek bar */
.seek-wrap{position:relative;margin-bottom:var(--space-3)}
.seek-bar{width:100%;height:4px;border-radius:var(--radius-full);
  -webkit-appearance:none;appearance:none;
  background:var(--surface-dyn);outline:none;cursor:pointer}
.seek-bar::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;
  border-radius:var(--radius-full);background:var(--primary);cursor:pointer;
  box-shadow:0 2px 8px var(--primary-glow)}
.seek-time{display:flex;justify-content:space-between;margin-top:var(--space-2);
  font-size:var(--text-xs);color:var(--text-faint);font-variant-numeric:tabular-nums}

/* Playback controls */
.playback{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3)}
.btn-play{width:48px;height:48px;border-radius:var(--radius-full);
  background:var(--primary);display:flex;align-items:center;justify-content:center;
  color:#fff;flex-shrink:0;transition:background var(--transition),transform var(--transition);
  box-shadow:0 4px 12px var(--primary-glow)}
.btn-play:active{background:var(--primary-hover);transform:scale(0.95)}
.time-display{font-variant-numeric:tabular-nums;font-size:var(--text-xs);
  color:var(--text-muted);min-width:90px}
.volume-wrapper{display:flex;align-items:center;gap:var(--space-2);margin-left:auto}
.volume-icon{color:var(--text-faint)}
input[type=range].vol{-webkit-appearance:none;width:64px;height:4px;
  border-radius:var(--radius-full);background:var(--surface-dyn);outline:none}
input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
  border-radius:var(--radius-full);background:var(--primary);cursor:pointer}

/* Trim section */
.trim-section{margin:var(--space-3) var(--space-4) 0;
  background:var(--surface);border-radius:var(--radius-xl);
  border:1px solid var(--border);padding:var(--space-4);display:none}
.trim-section.visible{display:block}
.section-label{font-size:var(--text-xs);font-weight:600;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--space-3)}

/* Timeline visual */
.timeline{position:relative;height:64px;background:var(--surface-off);
  border-radius:var(--radius-lg);overflow:hidden;margin-bottom:var(--space-3);cursor:crosshair;
  touch-action:none;-webkit-touch-callout:none}
/* Handle indicators */
.tl-handle{position:absolute;top:0;width:4px;height:100%;background:var(--primary);
  pointer-events:none;border-radius:2px}
.tl-handle::after{content:'';position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);width:16px;height:32px;
  background:var(--primary);border-radius:8px;opacity:.9}
.tl-selected{position:absolute;top:0;height:100%;background:var(--selection);
  border-left:2px solid var(--primary);border-right:2px solid var(--primary);
  pointer-events:none}
.tl-playhead{position:absolute;top:0;width:2px;height:100%;
  background:var(--text);pointer-events:none;opacity:.6}
.tl-labels{display:flex;justify-content:space-between;
  font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-bottom:var(--space-3)}

/* Time inputs */
.time-row{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.time-input-wrap{flex:1;display:flex;flex-direction:column;gap:4px}
.time-lbl{font-size:var(--text-xs);color:var(--text-faint)}
.time-input{background:var(--surface-off);border:1px solid var(--border);
  border-radius:var(--radius-md);color:var(--text);
  font-size:var(--text-sm);font-variant-numeric:tabular-nums;
  padding:var(--space-2) var(--space-3);width:100%;text-align:center}
.time-input:focus{outline:2px solid var(--primary);border-color:transparent}
.time-sep{color:var(--text-faint);padding-top:18px}

/* Preview bar */
.preview-bar{height:6px;background:var(--surface-off);border-radius:var(--radius-full);
  overflow:hidden;position:relative;margin-bottom:var(--space-3)}
.preview-fill{position:absolute;top:0;height:100%;background:var(--primary);
  border-radius:var(--radius-full);transition:left var(--transition),width var(--transition)}

/* Quick buttons */
.quick-btns{display:flex;gap:var(--space-2);margin-bottom:var(--space-2)}
.btn-secondary{flex:1;padding:var(--space-3);background:var(--surface-dyn);
  border:1px solid var(--border);border-radius:var(--radius-lg);
  font-size:var(--text-xs);font-weight:600;color:var(--text-muted);text-align:center}
.btn-secondary:active{background:var(--primary-glow);color:var(--primary);border-color:var(--primary)}

/* Action bar */
.action-bar{padding:var(--space-3) var(--space-4);
  padding-bottom:calc(var(--space-3) + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);background:var(--surface)}
.btn-primary{width:100%;padding:var(--space-4);background:var(--primary);color:#fff;
  border-radius:var(--radius-lg);font-size:var(--text-sm);font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:var(--space-2);
  transition:background var(--transition),transform var(--transition);
  box-shadow:0 4px 16px var(--primary-glow)}
.btn-primary:active{background:var(--primary-hover);transform:scale(0.99)}
.btn-primary:disabled{opacity:.4;pointer-events:none}

/* Toast */
.toast{position:fixed;bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);
  font-size:var(--text-xs);color:var(--text);box-shadow:var(--shadow-md);
  opacity:0;transition:all 300ms ease;z-index:100;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Progress */
.progress-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:50;align-items:center;justify-content:center;flex-direction:column;
  gap:var(--space-4);backdrop-filter:blur(4px)}
.progress-overlay.visible{display:flex}
.progress-box{background:var(--surface-2);border-radius:var(--radius-xl);
  padding:var(--space-8) var(--space-10);text-align:center;min-width:200px}
.progress-title{font-weight:600;margin-bottom:var(--space-3)}
.progress-bar-wrap{background:var(--surface-off);border-radius:var(--radius-full);
  height:6px;overflow:hidden;margin-bottom:var(--space-2)}
.progress-fill{height:100%;background:var(--primary);border-radius:var(--radius-full);transition:width 200ms ease}
.progress-pct{font-size:var(--text-xs);color:var(--text-muted);font-variant-numeric:tabular-nums}

.no-file-hint{text-align:center;padding:var(--space-8) var(--space-4);
  color:var(--text-faint);font-size:var(--text-xs)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      AudioEdit <span style="font-size:11px;font-weight:700;color:var(--primary);margin-left:6px;background:var(--primary-glow);padding:1px 6px;border-radius:999px">v7</span>
    </div>
    <div style="display:flex;gap:var(--space-2)">
      <button class="icon-btn" id="themeToggle" aria-label="切換主題">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="main" id="mainArea">
    <!-- Upload -->
    <div class="upload-zone" id="uploadZone" role="button" tabindex="0">
      <input type="file" id="fileInput" accept=".mp3,.wav,.m4a,.aac,.ogg,.flac,.caf,.aiff" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
      <svg class="upload-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <div class="upload-title">點擊或拖曳上傳</div>
      <div class="upload-sub">MP3 · WAV · AAC · M4A · OGG · FLAC</div>
      <div class="upload-formats">個人使用 · 本機處理 · 不上傳雲端</div>
    </div>

    <!-- File Info -->
    <div class="file-info" id="fileInfo">
      <div class="file-header">
        <div class="file-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div>
          <div class="file-name" id="fileName"></div>
          <div class="file-meta" id="fileMeta"></div>
        </div>
        <button class="btn-remove" id="btnRemove" aria-label="移除">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Player -->
    <div class="player-section" id="playerSection">
      <div class="seek-wrap">
        <input type="range" class="seek-bar" id="seekBar" min="0" max="1000" value="0" step="1">
      </div>
      <div class="seek-time">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
      <div class="playback">
        <button class="btn-play" id="btnPlay" aria-label="播放">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
        </button>
        <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
        <div class="volume-wrapper">
          <svg class="volume-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <input type="range" class="vol" id="volSlider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </div>

    <!-- Trim -->
    <div class="trim-section" id="trimSection">
      <div class="section-label">✂️ 剪切範圍</div>

      <!-- Timeline -->
      <div class="timeline" id="timeline">
        <div class="tl-selected" id="tlSelected"></div>
        <div class="tl-playhead" id="tlPlayhead"></div>
        <div class="tl-handle" id="tlHandleL" style="display:none"></div>
        <div class="tl-handle" id="tlHandleR" style="display:none"></div>
      </div>
      <div class="tl-labels">
        <span id="tlStart">0:00</span>
        <span id="tlMid"></span>
        <span id="tlEnd">0:00</span>
      </div>

      <!-- Time inputs -->
      <div class="time-row">
        <div class="time-input-wrap">
          <span class="time-lbl">開始</span>
          <input class="time-input" id="trimStart" type="text" value="0:00.0" aria-label="開始時間">
        </div>
        <span class="time-sep">→</span>
        <div class="time-input-wrap">
          <span class="time-lbl">結束</span>
          <input class="time-input" id="trimEnd" type="text" value="0:00.0" aria-label="結束時間">
        </div>
      </div>

      <!-- Preview bar -->
      <div class="preview-bar">
        <div class="preview-fill" id="previewFill" style="left:0%;width:100%"></div>
      </div>

      <!-- Quick actions -->
      <div class="quick-btns">
        <button class="btn-secondary" onclick="selectAll()">全選</button>
        <button class="btn-secondary" onclick="previewSel()">▶ 預覽選段</button>
        <button class="btn-secondary" onclick="setStartHere()">從此開始</button>
        <button class="btn-secondary" onclick="setEndHere()">至此結束</button>
      </div>
    </div>

    <div class="no-file-hint" id="noHint">請先上傳音訊檔案</div>
  </div>

  <div class="action-bar">
    <button class="btn-primary" id="btnAction" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      匯出剪切片段
    </button>
  </div>
</div>

<div class="toast" id="toast" role="alert"></div>
<div class="progress-overlay" id="progressOverlay">
  <div class="progress-box">
    <div class="progress-title" id="progressTitle">處理中…</div>
    <div class="progress-bar-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-pct" id="progressPct">0%</div>
  </div>
</div>

<!-- Hidden audio element for streaming playback -->
<audio id="audioEl" style="display:none" playsinline webkit-playsinline preload="metadata"></audio>

<script>
// ── State ──
let audioEl = document.getElementById('audioEl');
let objectURL = null;
let originalFile = null;
let duration = 0;
let isPlaying = false;
let sel = { start: null, end: null };
let previewTimer = null;
let isDragging = false;
let dragTarget = null; // 'start' | 'end' | 'body'
let dragStartX = 0, dragStartSelStart = 0, dragStartSelEnd = 0;

// ── Theme ──
const themeToggle = document.getElementById('themeToggle');
let currentTheme = 'dark';
themeToggle.addEventListener('click', () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  themeToggle.innerHTML = currentTheme === 'dark'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
});

// ── Upload ──
const uploadZone = document.getElementById('uploadZone');
const fileInput  = document.getElementById('fileInput');

uploadZone.addEventListener('click', () => { try { fileInput.click(); } catch(e){} });
uploadZone.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') fileInput.click(); });
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault(); uploadZone.classList.remove('drag-over');
  if(e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function(e) {
  const f = e.target.files && e.target.files[0];
  if (f) loadFile(f);
  setTimeout(() => { try { fileInput.value = ''; } catch(e2){} }, 1000);
});

// ── Load File (streaming, no full decode) ──
function loadFile(file) {
  showToast('⏳ 載入：' + file.name);
  originalFile = file;
  // Revoke previous object URL
  if (objectURL) { URL.revokeObjectURL(objectURL); objectURL = null; }
  objectURL = URL.createObjectURL(file);
  audioEl.src = objectURL;
  audioEl.load();
  audioEl.onloadedmetadata = function() {
    duration = audioEl.duration;
    sel.start = 0;
    sel.end = duration;
    setupUI(file);
    showToast('✓ 載入成功 · ' + fmtFull(duration));
  };
  audioEl.onerror = function() {
    showToast('❌ 不支援此格式，請試 .m4a 或 .mp3');
  };
}

// ── Setup UI ──
function setupUI(file) {
  uploadZone.style.display = 'none';
  document.getElementById('noHint').style.display = 'none';
  const fi = document.getElementById('fileInfo');
  fi.classList.add('visible');
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('fileMeta').textContent = fmtSize(file.size) + ' · ' + fmtFull(duration);
  document.getElementById('playerSection').classList.add('visible');
  document.getElementById('trimSection').classList.add('visible');
  document.getElementById('btnAction').disabled = false;
  document.getElementById('seekBar').value = 0;
  document.getElementById('totalTime').textContent = fmt(duration);
  document.getElementById('tlEnd').textContent = fmt(duration);
  document.getElementById('tlMid').textContent = fmt(duration/2);
  updateTrimInputs();
  updateTimeline();
  updatePreviewBar();
}

// ── Remove ──
document.getElementById('btnRemove').addEventListener('click', () => {
  audioEl.pause(); audioEl.src = '';
  if (objectURL) { URL.revokeObjectURL(objectURL); objectURL = null; }
  originalFile = null; duration = 0; isPlaying = false;
  sel = { start: null, end: null };
  uploadZone.style.display = '';
  document.getElementById('noHint').style.display = '';
  document.getElementById('fileInfo').classList.remove('visible');
  document.getElementById('playerSection').classList.remove('visible');
  document.getElementById('trimSection').classList.remove('visible');
  document.getElementById('btnAction').disabled = true;
  document.getElementById('playIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
  isPlaying = false;
  showToast('已移除檔案');
});

// ── Playback ──
document.getElementById('btnPlay').addEventListener('click', () => {
  if (!duration) return;
  if (isPlaying) {
    audioEl.pause();
  } else {
    audioEl.volume = parseFloat(document.getElementById('volSlider').value);
    audioEl.play().catch(e => showToast('❌ 播放失敗：' + e.message));
  }
});

audioEl.addEventListener('play', () => {
  isPlaying = true;
  document.getElementById('playIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
});
audioEl.addEventListener('pause', () => {
  isPlaying = false;
  document.getElementById('playIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
});
audioEl.addEventListener('ended', () => {
  isPlaying = false;
  document.getElementById('playIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
});
audioEl.addEventListener('timeupdate', () => {
  const t = audioEl.currentTime;
  const d = duration || 1;
  document.getElementById('currentTime').textContent = fmt(t);
  document.getElementById('timeDisplay').textContent = fmt(t) + ' / ' + fmt(d);
  document.getElementById('seekBar').value = Math.round(t / d * 1000);
  updatePlayhead(t);
  // Stop at sel.end when previewing
  if (previewTimer !== null && t >= (sel.end || d)) {
    audioEl.pause();
    audioEl.currentTime = sel.start || 0;
    clearTimeout(previewTimer);
    previewTimer = null;
  }
});

document.getElementById('seekBar').addEventListener('input', e => {
  if (!duration) return;
  const t = parseFloat(e.target.value) / 1000 * duration;
  audioEl.currentTime = t;
});
document.getElementById('volSlider').addEventListener('input', e => {
  audioEl.volume = parseFloat(e.target.value);
});

// ── Timeline drag ──
const tl = document.getElementById('timeline');

function tlClientToTime(clientX) {
  const rect = tl.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  return ratio * duration;
}

function getHandleAt(clientX) {
  if (sel.start === null || sel.end === null) return 'new';
  const rect = tl.getBoundingClientRect();
  const sx = (sel.start / duration) * rect.width + rect.left;
  const ex = (sel.end   / duration) * rect.width + rect.left;
  const thresh = 28;
  if (Math.abs(clientX - sx) < thresh) return 'start';
  if (Math.abs(clientX - ex) < thresh) return 'end';
  const t = tlClientToTime(clientX);
  if (t >= sel.start && t <= sel.end) return 'body';
  return 'new';
}

tl.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!duration) return;
  const x = e.touches[0].clientX;
  dragTarget = getHandleAt(x);
  if (dragTarget === 'new') {
    const t = tlClientToTime(x);
    sel.start = t; sel.end = t;
    dragTarget = 'end';
  }
  isDragging = true;
  dragStartX = x;
  dragStartSelStart = sel.start;
  dragStartSelEnd = sel.end;
  updateTimeline();
}, { passive: false });

tl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!isDragging) return;
  const x = e.touches[0].clientX;
  moveDrag(x);
}, { passive: false });

tl.addEventListener('touchend', e => {
  e.preventDefault();
  isDragging = false;
  snapToSecond();
  updateTrimInputs();
  updatePreviewBar();
}, { passive: false });

tl.addEventListener('mousedown', e => {
  if (!duration) return;
  dragTarget = getHandleAt(e.clientX);
  if (dragTarget === 'new') {
    const t = tlClientToTime(e.clientX);
    sel.start = t; sel.end = t;
    dragTarget = 'end';
  }
  isDragging = true;
  dragStartX = e.clientX;
  dragStartSelStart = sel.start;
  dragStartSelEnd = sel.end;
  updateTimeline();
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  moveDrag(e.clientX);
});
window.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  snapToSecond();
  updateTrimInputs();
  updatePreviewBar();
});

function moveDrag(clientX) {
  const rect = tl.getBoundingClientRect();
  const dx = clientX - dragStartX;
  const dTime = (dx / rect.width) * duration;
  if (dragTarget === 'start') {
    sel.start = Math.max(0, Math.min(dragStartSelStart + dTime, sel.end - 0.1));
  } else if (dragTarget === 'end') {
    sel.end = Math.max(sel.start + 0.1, Math.min(dragStartSelEnd + dTime, duration));
  } else if (dragTarget === 'body') {
    const len = dragStartSelEnd - dragStartSelStart;
    let ns = Math.max(0, Math.min(dragStartSelStart + dTime, duration - len));
    sel.start = ns; sel.end = ns + len;
  }
  updateTimeline();
}

function snapToSecond() {
  // snap to 0.1s
  sel.start = Math.round(sel.start * 10) / 10;
  sel.end   = Math.round(sel.end   * 10) / 10;
}

function updateTimeline() {
  if (!duration) return;
  const pct = x => (x / duration * 100).toFixed(2) + '%';
  const sel_s = sel.start !== null ? sel.start : 0;
  const sel_e = sel.end   !== null ? sel.end   : duration;
  document.getElementById('tlSelected').style.left  = pct(sel_s);
  document.getElementById('tlSelected').style.width = pct(sel_e - sel_s);
  const hl = document.getElementById('tlHandleL');
  const hr = document.getElementById('tlHandleR');
  if (sel.start !== null) {
    hl.style.display = ''; hl.style.left = 'calc(' + pct(sel_s) + ' - 2px)';
    hr.style.display = ''; hr.style.left = 'calc(' + pct(sel_e) + ' - 2px)';
  }
}

function updatePlayhead(t) {
  if (!duration) return;
  document.getElementById('tlPlayhead').style.left = (t / duration * 100).toFixed(2) + '%';
}

function updatePreviewBar() {
  const s = sel.start !== null ? sel.start : 0;
  const e = sel.end   !== null ? sel.end   : duration;
  const d = duration || 1;
  document.getElementById('previewFill').style.left  = (s/d*100).toFixed(1) + '%';
  document.getElementById('previewFill').style.width = ((e-s)/d*100).toFixed(1) + '%';
}

// ── Trim inputs ──
function updateTrimInputs() {
  const s = sel.start !== null ? sel.start : 0;
  const e = sel.end   !== null ? sel.end   : duration;
  document.getElementById('trimStart').value = fmtFull(s);
  document.getElementById('trimEnd').value   = fmtFull(e);
}

function parseTrimInput(val) {
  val = val.trim();
  const p = val.split(':');
  if (p.length === 2) return parseFloat(p[0]) * 60 + parseFloat(p[1]);
  return parseFloat(val) || 0;
}

document.getElementById('trimStart').addEventListener('blur', () => {
  sel.start = Math.max(0, Math.min(parseTrimInput(document.getElementById('trimStart').value), sel.end - 0.1));
  updateTrimInputs(); updateTimeline(); updatePreviewBar();
});
document.getElementById('trimEnd').addEventListener('blur', () => {
  sel.end = Math.max(sel.start + 0.1, Math.min(parseTrimInput(document.getElementById('trimEnd').value), duration));
  updateTrimInputs(); updateTimeline(); updatePreviewBar();
});

// ── Quick buttons ──
function selectAll() {
  sel.start = 0; sel.end = duration;
  updateTrimInputs(); updateTimeline(); updatePreviewBar();
}
function previewSel() {
  if (!duration) return;
  clearTimeout(previewTimer);
  audioEl.currentTime = sel.start || 0;
  audioEl.volume = parseFloat(document.getElementById('volSlider').value);
  audioEl.play().catch(e => showToast('❌ ' + e.message));
  previewTimer = setTimeout(() => {
    audioEl.pause();
    audioEl.currentTime = sel.start || 0;
    previewTimer = null;
  }, ((sel.end || duration) - (sel.start || 0)) * 1000 + 200);
  showToast('▶ 預覽中…');
}
function setStartHere() {
  sel.start = Math.min(audioEl.currentTime, sel.end - 0.1);
  updateTrimInputs(); updateTimeline(); updatePreviewBar();
  showToast('✓ 開始點已設定');
}
function setEndHere() {
  sel.end = Math.max(audioEl.currentTime, sel.start + 0.1);
  updateTrimInputs(); updateTimeline(); updatePreviewBar();
  showToast('✓ 結束點已設定');
}

// ── Export (Web Audio only for selected chunk) ──
document.getElementById('btnAction').addEventListener('click', doExport);

async function doExport() {
  if (!originalFile || !duration) return;
  const trimS = sel.start !== null ? sel.start : 0;
  const trimE = sel.end   !== null ? sel.end   : duration;
  if (trimE - trimS < 0.1) { showToast('請先選取剪切範圍'); return; }

  showProgress('解碼選取片段…', 10);

  try {
    // Read only the portion we need via OfflineAudioContext
    const ab = await originalFile.arrayBuffer();
    updateProgress(30);

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const tmpCtx = new AudioCtx();

    // Decode full buffer (needed for precise export)
    // But we do it in a temporary context and release immediately
    const decoded = await new Promise((resolve, reject) => {
      tmpCtx.decodeAudioData(ab.slice(0), resolve, reject);
    });
    updateProgress(60);

    const sr = decoded.sampleRate;
    const startSample = Math.floor(trimS * sr);
    const endSample   = Math.ceil(trimE * sr);
    const len = endSample - startSample;
    const nCh = decoded.numberOfChannels;

    const outBuf = tmpCtx.createBuffer(nCh, len, sr);
    for (let ch = 0; ch < nCh; ch++) {
      outBuf.copyToChannel(decoded.getChannelData(ch).slice(startSample, endSample), ch);
    }
    tmpCtx.close();
    updateProgress(80);

    const wav = encodeWAV(outBuf);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    const base = (originalFile.name || 'audio').replace(/\.[^.]+$/, '');
    a.href = url; a.download = base + '_edited.wav';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    updateProgress(100);
    setTimeout(hideProgress, 400);
    showToast('✓ 已匯出 ' + fmtFull(trimE - trimS));
  } catch(e) {
    hideProgress();
    showToast('❌ 匯出失敗：' + (e.message || '未知錯誤'));
  }
}

function encodeWAV(buffer) {
  const nCh = buffer.numberOfChannels, sr = buffer.sampleRate, n = buffer.length;
  const bl = n * nCh * 2, ab = new ArrayBuffer(44 + bl), v = new DataView(ab);
  const ws = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); v.setUint32(4, 36+bl, true); ws(8,'WAVE'); ws(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,nCh,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*nCh*2,true);
  v.setUint16(32,nCh*2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,bl,true);
  let off = 44;
  const chs = [];
  for(let c=0;c<nCh;c++) chs.push(buffer.getChannelData(c));
  for(let i=0;i<n;i++) for(let c=0;c<nCh;c++) {
    const s = Math.max(-1,Math.min(1,chs[c][i]));
    v.setInt16(off, s<0?s*0x8000:s*0x7FFF, true); off+=2;
  }
  return ab;
}

// ── Helpers ──
function fmt(s) {
  const m = Math.floor(s/60);
  return m + ':' + String(Math.floor(s%60)).padStart(2,'0');
}
function fmtFull(s) {
  const m = Math.floor(s/60), sec = Math.floor(s%60), ms = Math.floor((s%1)*10);
  return m + ':' + String(sec).padStart(2,'0') + '.' + ms;
}
function fmtSize(b) {
  return b<1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';
}

// Progress / Toast
function showProgress(title, pct) {
  document.getElementById('progressTitle').textContent = title;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressOverlay').classList.add('visible');
}
function updateProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}
function hideProgress() { document.getElementById('progressOverlay').classList.remove('visible'); }
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
